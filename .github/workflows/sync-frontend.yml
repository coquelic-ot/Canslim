name: フロントエンドを gh-pages に同期

on:
  workflow_dispatch:   # GitHub Actions 画面から手動実行

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          ref: claude/oneill-stock-selector-ID7mD
          fetch-depth: 0

      - name: フロントエンドを gh-pages に反映
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          git fetch origin gh-pages
          git checkout gh-pages

          git checkout origin/claude/oneill-stock-selector-ID7mD -- stock.html stock.css stock.js sw.js

          git add stock.html stock.css stock.js sw.js
          if git diff --staged --quiet; then
            echo "変更なし — スキップ"
          else
            git commit -m "Sync frontend from feature branch $(date +'%Y-%m-%d %H:%M UTC')"
            git push origin gh-pages
          fi
