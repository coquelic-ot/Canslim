<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1e3a5f" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <!-- bfcache無効化: unloadリスナーがあるページはiOS SafariがbfcacheしないためTesseract先祖返り防止 -->
  <script>
    // Layer 1: pageshow fires on bfcache restore — setTimeout escapes iOS blocking
    window.addEventListener('pageshow', function(e) {
      if (e.persisted) setTimeout(function() { window.location.replace(location.href); }, 50);
    });
    // Layer 2: navigation type back_forward on DOMContentLoaded (non-bfcache stale guard)
    document.addEventListener('DOMContentLoaded', function() {
      try {
        var nav = performance.getEntriesByType('navigation')[0];
        if (nav && nav.type === 'back_forward') window.location.replace(location.href);
      } catch(e) {}
    });
    window.addEventListener('unload', function(){});
    if ('serviceWorker' in navigator) {
      // Layer 3: SW sends RELOAD on activate — catches pages queued in bfcache
      navigator.serviceWorker.addEventListener('message', function(e) {
        if (e.data && e.data.type === 'RELOAD') window.location.replace(location.href);
      });
      navigator.serviceWorker.register('./sw.js').then(function(reg) {
        reg.addEventListener('updatefound', function() {
          var nw = reg.installing;
          nw.addEventListener('statechange', function() {
            if (nw.state === 'activated') window.location.reload();
          });
        });
      });
    }
  </script>
  <title>CAN SLIM 銘柄チェッカー</title>
  <link rel="stylesheet" href="stock.css?v=10" />
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <h1>CAN SLIM<span class="brand-sub"> 銘柄チェッカー</span></h1>
      <p class="brand-caption">William O'Neil 式 銘柄選定ツール</p>
    </div>
    <div class="header-actions">
      <button class="btn-market" id="market-btn">
        <span id="market-indicator">📊</span>
        <span id="market-label">市場設定</span>
      </button>
      <button class="btn-icon" id="settings-btn" title="設定">⚙</button>
    </div>
  </div>
  <nav class="tab-nav">
    <button class="tab-btn active" data-tab="import">📥 インポート</button>
    <button class="tab-btn" data-tab="analyze">📊 分析</button>
    <button class="tab-btn" data-tab="compare">⚖ 比較</button>
    <button class="tab-btn" data-tab="history">📋 履歴</button>
  </nav>
</header>

<main class="main">
  <div id="tab-import"  class="tab-panel active"></div>
  <div id="tab-analyze" class="tab-panel"></div>
  <div id="tab-compare" class="tab-panel"></div>
  <div id="tab-history" class="tab-panel"></div>
</main>

<!-- モーダルはすべてstock.jsで描画 -->
<div class="modal-overlay hidden" id="settings-modal"></div>
<div class="modal-overlay hidden" id="market-modal"></div>

<div class="toast hidden" id="toast"></div>

<!-- Lightbox -->
<div class="lightbox hidden" id="lightbox">
  <div class="lightbox-bg" id="lightbox-bg"></div>
  <img class="lightbox-img" id="lightbox-img" src="" alt="" />
  <button class="lightbox-close" id="lightbox-close">✕</button>
</div>

<script src="stock.js?v=12"></script>
</body>
</html>
